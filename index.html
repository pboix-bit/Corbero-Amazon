<style>

body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#fff}

<body><title>Corberó Seguimiento Q4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Panel de control: cabecera fija con buscador global, barra de pestañas por hoja,
   y en cada pestaña una franja de filtros sobre una tabla densa. Ficha lateral al pulsar un ASIN.
   Aspecto fijo por indicación de la marca: fondo blanco, texto negro y rojo Corberó.
   El rojo es el color de marca Y el de alarma, así que la gravedad se distingue por la
   FORMA: el rojo relleno con texto blanco grita, el rojo en texto solo señala. */
:root{
  color-scheme:light;
  --ground:#ffffff; --panel:#ffffff; --panel-2:#f6f6f7; --line:#dcdcdf; --line-soft:#eeeef0;
  --ink:#111113; --ink-2:#4a4a50; --ink-3:#85858e;
  --accent:#d41920; --accent-deep:#a81218; --accent-soft:#fdeceb; --accent-line:#f0b5b3;
  --ok:#1f7a46; --ok-soft:#e9f4ed; --warn:#9a6208; --warn-soft:#fcf3e1;
  --bad:#d41920; --bad-soft:#fdeceb; --cool:#2c5c86; --cool-soft:#eaf1f7;
  --shadow:0 1px 2px rgba(17,17,19,.05),0 3px 10px rgba(17,17,19,.04);
  --f-ui:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ---------- cabecera ---------- */
/* Cabecera y pestañas van dentro de un único contenedor fijo: así no hay que
   acertar un desplazamiento a mano y la barra de pestañas nunca queda tapada. */
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.top{background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1500px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto}
.mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;
  font-weight:700;font-size:15px;flex:none;letter-spacing:-.02em}
.brand h1{font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand>div{min-width:0}
.top-sp{flex:1 1 0;min-width:0}
.top-end{display:flex;align-items:center;gap:10px;flex:none}
.stamp{font-size:11px;color:var(--ink-3);text-align:right;line-height:1.3;white-space:nowrap}
.stamp b{display:block;color:var(--ink-2);font-weight:600;font-size:11.5px}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;
  color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}

/* buscador global */
.gs{position:relative;flex:1 1 150px;max-width:330px;min-width:0}
.gs input{width:100%;padding:7px 11px 7px 30px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--ink);font-size:13px;font-family:var(--f-ui)}
.gs input:focus{background:var(--panel);border-color:var(--accent-line)}
.gs input::placeholder{color:var(--ink-3)}
.gs svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.gs-out{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);max-height:330px;overflow:auto;z-index:60}
.gs-out button{display:block;width:100%;text-align:left;padding:8px 11px;border-bottom:1px solid var(--line-soft)}
.gs-out button:last-child{border-bottom:0}
.gs-out button:hover{background:var(--accent-soft)}
.gs-out .a{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500}
.gs-out .t{font-size:11.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.gs-none{padding:10px 11px;font-size:12px;color:var(--ink-3)}

/* ---------- pestañas ---------- */
.tabs{background:var(--panel);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1500px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;
  scrollbar-color:var(--line) transparent}
.tabs-in::-webkit-scrollbar{height:3px}
.tabs-in::-webkit-scrollbar-track{background:transparent}
.tabs-in::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
.tab{padding:9px 13px;font-size:12.5px;font-weight:500;color:var(--ink-3);white-space:nowrap;
  border-bottom:2px solid transparent;letter-spacing:.01em}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);margin-left:5px}
.tab[aria-selected="true"] .n{color:var(--accent)}

/* ---------- lienzo ---------- */
.wrap{max-width:1500px;margin:0 auto;padding:16px;padding-block:18px 56px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-h{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.card-h .sub{font-size:11.5px;color:var(--ink-3);margin-left:auto}
.grid{display:grid;gap:12px}
.sec{margin-bottom:16px}

/* KPI: el número de columnas se fija según cuántas tarjetas hay, para que
   ninguna fila quede a medias con un hueco al lado. */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){
  .kpis.n3{grid-template-columns:repeat(3,1fr)}
  .kpis.n4,.kpis.n6{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:900px){
  .kpis.n4{grid-template-columns:repeat(4,1fr)}
  .kpis.n5{grid-template-columns:repeat(5,1fr)}
  .kpis.n6{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1240px){ .kpis.n6{grid-template-columns:repeat(6,1fr)} }
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow)}
.kpi .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.kpi .v{font-size:27px;font-weight:700;letter-spacing:-.025em;margin-top:3px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .fo{font-size:11.5px;color:var(--ink-2);margin-top:3px}
.kpi.is-bad{border-color:var(--bad)}
.kpi.is-bad .v{color:var(--bad)}
.kpi.is-ok .v{color:var(--ok)}
.kpi.is-cool .v{color:var(--cool)}
/* los indicadores que llevan a algún sitio se comportan como un botón;
   los que no, se quedan como una tarjeta y no fingen ser pulsables */
.kpi.clic{cursor:pointer;position:relative;text-align:left;width:100%;display:block;font:inherit;color:inherit}
.kpi.clic:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.kpi.clic .ver{position:absolute;top:12px;right:13px;font-size:10.5px;color:var(--ink-3);opacity:0;transition:opacity .12s}
.kpi.clic:hover .ver,.kpi.clic:focus-visible .ver{opacity:1;color:var(--accent)}
@media(prefers-reduced-motion:reduce){.kpi.clic .ver{transition:none}}
.fb .quitar{font-size:11.5px;color:var(--accent);text-decoration:underline;padding:0 2px}

/* chips y badges */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;color:var(--ink-2);
  background:var(--panel-2);font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--accent-line);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chip .c{font-family:var(--f-mono);font-size:10.5px;opacity:.75;margin-left:4px}
.b{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:600;white-space:nowrap;
  letter-spacing:.01em}
.b-ok{background:var(--ok-soft);color:var(--ok)}
/* el crítico va relleno: es la única forma de que destaque sobre un acento que ya es rojo */
.b-bad{background:var(--bad);color:#fff}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-cool{background:var(--cool-soft);color:var(--cool)}
.b-mute{background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line)}

/* tablas */
.tw{overflow-x:auto;border-radius:0 0 12px 12px}
/* Las tablas largas se desplazan dentro de su propia caja. Así la cabecera se queda
   pegada a SU contenedor y no flota sobre las filas, que es lo que pasaba cuando iba
   pegada a la ventana con un desplazamiento calculado a mano. */
.tw.scroll{max-height:min(68vh,720px);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:8px 11px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  font-weight:600;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
.tw.scroll th{position:sticky;top:0;z-index:1}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--ink)}
th .ar{opacity:.55;font-size:9px}
td{padding:7px 11px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:hover{background:var(--panel-2)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.asin{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);font-weight:500;cursor:pointer;white-space:nowrap}
.asin:hover{text-decoration:underline}
.sku{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.ti{max-width:330px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ti-1{max-width:300px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:34px 16px;text-align:center;color:var(--ink-3);font-size:13px}

/* barra de filtros */
.fb{padding:10px 15px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  background:var(--panel-2)}
.fb input[type=search],.fb select{padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);font-size:12.5px;font-family:var(--f-ui);min-width:0}
.fb input[type=search]{flex:1 1 180px;max-width:280px}
.fb .cnt{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono);white-space:nowrap}

/* barras y gráficos */
.bars{display:grid;gap:7px;padding:13px 15px}
.bar-row{display:grid;grid-template-columns:minmax(96px,auto) 1fr minmax(52px,auto);gap:10px;align-items:center;font-size:12px}
.bar-row .nm{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* display:block es obligatorio: sin él el span queda en línea, el alto no se
   aplica y el ancho en porcentaje del relleno no tiene contra qué resolverse. */
.bar-t{display:block;height:8px;border-radius:999px;background:var(--line-soft);overflow:hidden;min-width:0}
.bar-f{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar-row .vv{text-align:right;font-family:var(--f-mono);font-size:11.5px;color:var(--ink)}
svg{display:block;max-width:100%}

/* ficha lateral */
.sheet{position:fixed;inset:0;z-index:90;display:none}
.sheet[data-open="1"]{display:block}
.scrim{position:absolute;inset:0;background:rgba(17,17,19,.34);backdrop-filter:blur(2px)}
.panelr{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel-2);
  border-left:1px solid var(--line);overflow-y:auto;box-shadow:-12px 0 36px rgba(17,17,19,.14);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pr-h{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:13px 16px;z-index:2;
  display:flex;gap:10px;align-items:flex-start}
.pr-h .x{margin-left:auto;flex:none}
.pr-b{padding:14px 16px 40px;display:grid;gap:12px}
.fset{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fset h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:9px 13px;
  border-bottom:1px solid var(--line);background:var(--panel-2)}
.kv{display:grid;grid-template-columns:minmax(104px,38%) 1fr;gap:1px;background:var(--line-soft)}
.kv>div{background:var(--panel);padding:7px 13px;font-size:12.5px;min-width:0;overflow-wrap:anywhere}
.kv .k{color:var(--ink-3);font-size:11.5px}
.fnote{padding:10px 13px;font-size:12px;color:var(--ink-2)}

.note{font-size:11.5px;color:var(--ink-3);padding:10px 15px;border-top:1px solid var(--line-soft);line-height:1.5}
.note b{color:var(--ink-2);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:860px){.two{grid-template-columns:1fr}.ti{max-width:200px}}
@media(max-width:820px){.stamp{display:none}}
@media(max-width:620px){.brand p{display:none}.brand h1{font-size:14px}}
@media(max-width:470px){.brand h1{display:none}}
</style>

    '<div class="fb"></div><div class="tw"></div>'+(cfg.note?'<div class="note">'+cfg.note+'</div>':'')+'</section>');
  var fb = host.querySelector(".fb"), tw = host.querySelector(".tw");
  var state = {q:"", chip:null, sel:{}, sort:cfg.sort==null?-1:cfg.sort, dir:cfg.dir||1};

  var inp = el('<input type="search" placeholder="'+esc(cfg.ph||"Filtrar…")+'" aria-label="Filtrar la tabla">');
  fb.appendChild(inp);
  inp.addEventListener("input",function(){ state.q=inp.value.trim().toLowerCase(); draw(); });

  var selEls = {};
  (cfg.selects||[]).forEach(function(sc){
    var s = el('<select aria-label="'+esc(sc.label)+'"><option value="">'+esc(sc.label)+'</option>'+
      sc.opts.map(function(o){ return '<option value="'+esc(o)+'">'+esc(o)+'</option>'; }).join("")+'</select>');
    fb.appendChild(s);
    selEls[sc.key] = s;
    s.addEventListener("change",function(){ state.sel[sc.key]=s.value; draw(); });
  });

  var chipEls = {};
  if(cfg.chips && cfg.chips.length){
    var cw = el('<span class="chips"></span>');
    cfg.chips.forEach(function(c){
      var b = el('<button class="chip" aria-pressed="false">'+esc(c.t)+'<span class="c">'+c.n+'</span></button>');
      chipEls[c.v] = b;
      b.addEventListener("click",function(){
        var on = state.chip===c.v; state.chip = on?null:c.v;
        cw.querySelectorAll(".chip").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
        if(!on) b.setAttribute("aria-pressed","true");
        draw();
      });
      cw.appendChild(b);
    });
    fb.appendChild(cw);
  }
  var quitar = el('<button class="quitar" hidden>quitar el filtro</button>');
  fb.appendChild(quitar);
  quitar.addEventListener("click",function(){
    state.q=""; state.chip=null; state.sel={}; inp.value="";
    Object.keys(selEls).forEach(function(k){ selEls[k].value=""; });
    Object.keys(chipEls).forEach(function(k){ chipEls[k].setAttribute("aria-pressed","false"); });
    draw();
  });
  var cnt = el('<span class="cnt"></span>'); fb.appendChild(cnt);

  // Filtro que llega desde un indicador pulsado en otra pestaña.
  if(window.__pend && cfg.id && window.__pend.tabla === cfg.id){
    var p = window.__pend; window.__pend = null;
    if(p.sel) Object.keys(p.sel).forEach(function(k){
      state.sel[k] = p.sel[k];
      if(selEls[k]) selEls[k].value = p.sel[k];
    });
    if(p.chip != null){
      state.chip = p.chip;
      if(chipEls[p.chip]) chipEls[p.chip].setAttribute("aria-pressed","true");
    }
    setTimeout(function(){
      var y = host.getBoundingClientRect().top + window.pageYOffset -
              (document.getElementById("stick").offsetHeight + 8);
      window.scrollTo({ top: Math.max(0,y), behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth" });
    }, 30);
  }

  function filtered(){
    var out = cfg.rows;
    if(state.chip!=null && cfg.chipTest) out = out.filter(function(r){ return cfg.chipTest(r,state.chip); });
    Object.keys(state.sel).forEach(function(k){
      var v=state.sel[k]; if(!v) return;
      var sc = (cfg.selects||[]).filter(function(x){return x.key===k;})[0];
      if(sc) out = out.filter(function(r){ return sc.test(r,v); });
    });
    if(state.q) out = out.filter(function(r){ return cfg.search(r).indexOf(state.q)>-1; });
    // si el índice de orden no apunta a ninguna columna, no se ordena y ya está:
    // antes esto tiraba la pestaña entera
    var c = state.sort > -1 ? cfg.cols[state.sort] : null;
    if(!c) state.sort = -1;
    if(c){
      out = out.slice().sort(function(a,b){
        var va = c.sortv?c.sortv(a):a[c.k], vb = c.sortv?c.sortv(b):b[c.k];
        var na = num(va), nb = num(vb);
        if(na!==null && nb!==null) return (na-nb)*state.dir;
        if(na!==null) return -1*state.dir; if(nb!==null) return 1*state.dir;
        return String(va==null?"":va).localeCompare(String(vb==null?"":vb),"es")*state.dir;
      });
    }
    return out;
  }
  function draw(){
    var rows = filtered();
    var hayFiltro = !!(state.q || state.chip!=null || Object.keys(state.sel).some(function(k){ return state.sel[k]; }));
    quitar.hidden = !hayFiltro;
    cnt.textContent = rows.length===cfg.rows.length ? fm(rows.length)+" filas" : fm(rows.length)+" de "+fm(cfg.rows.length);
    if(!rows.length){ tw.innerHTML='<div class="empty">Ninguna fila cumple el filtro.</div>'; return; }
    var lim = Math.min(rows.length, cfg.max||1200);
    var h = '<table><thead><tr>'+cfg.cols.map(function(c,i){
      var ar = state.sort===i ? '<span class="ar">'+(state.dir>0?"▲":"▼")+'</span>' : '';
      return '<th class="s'+(c.r?" r":"")+'" data-i="'+i+'"'+(c.w?' style="width:'+c.w+'"':'')+'>'+esc(c.t)+' '+ar+'</th>';
    }).join("")+'</tr></thead><tbody>';
    for(var i=0;i<lim;i++){
      var r=rows[i];
      h += '<tr>'+cfg.cols.map(function(c){
        return '<td'+(c.r?' class="r"':'')+'>'+(c.render?c.render(r):esc(txt(r[c.k])))+'</td>';
      }).join("")+'</tr>';
    }
    h += '</tbody></table>';
    if(lim<rows.length) h += '<div class="empty">Se muestran las primeras '+fm(lim)+' de '+fm(rows.length)+'. Afina el filtro para ver el resto.</div>';
    tw.innerHTML = h;
    // sólo las tablas largas se desplazan por dentro; las cortas se leen de una vez
    if(lim > 18) tw.classList.add("scroll"); else tw.classList.remove("scroll");
    tw.scrollTop = 0;
    tw.querySelectorAll("th.s").forEach(function(th){
      th.addEventListener("click",function(){
        var i=+th.dataset.i;
        if(state.sort===i) state.dir=-state.dir; else { state.sort=i; state.dir=1; }
        draw();
      });
    });
  }
  draw();
  return host;
}

    h += '<div style="font-size:12.5px;color:var(--ink-2);padding:0 2px">'+esc(txt(r[4]))+'</div>';
    h += fset("Stock y oferta", kvs([
      ["Oferta en Seller", ofertaB(r[6])+(/^Activa/.test(String(r[6]||""))?' <span style="color:var(--ink-3);font-size:11.5px">'+esc(r[6])+'</span>':'')],

      ["Stock Vendor", r[7]==null?"—":'<span class="num">'+fm(r[7])+'</span> <span style="color:var(--ink-3);font-size:11px">foto del 01/10, no del día del corte</span>'],
      ["PVP Seller", r[8]==null?null:(eur(r[8])+(r.__precio?' <span class="b b-warn">según Amazon</span><div style="font-size:11px;color:var(--ink-3);margin-top:3px">El libro dice '+eur(r.__precio.libro)+'. '+esc(r.__precio.porque)+'</div>':''))],
      ["PVP Vendor", r[9]==null?null:eur(r[9])],
      ["BuyBox Seller", bbB(r[10])],
      ["BuyBox Vendor", bbB(r[11])],
      ["Score", r[12]==null?null:'<span class="num">'+fm(r[12],1)+'</span> ★'+(num(r[12])<3.5?' <span class="b b-bad">bloquea ofertas</span>':'')],
      ["Reseñas", r[13]==null?null:fm(r[13])],

    ]));
  } else {
    h += '<div class="fnote">Esta referencia no está en el catálogo consolidado.</div>';
  }

  var c3 = p3By[asin]||[];
  if(c3.length){
    /* La columna 18 del informe («Nos quita BuyBox») NO sirve para esto: se enciende
       sobre todo cuando falta nuestro precio, llega a marcar varias ofertas del mismo
       ASIN a la vez, y marcaba fichas que en realidad ganamos. En su lugar se dice,
       una sola vez y para toda la ficha, quién tiene la oferta destacada de verdad. */
    var vf = (window.VERIF && window.VERIF.ref) ? window.VERIF.ref[asin] : null;
    var quienBB = !vf ? '<span class="b b-mute">sin comprobar en la ficha</span>'
      : vf[0]==="N" ? '<span class="b b-ok">la tenemos nosotros</span>'
      : vf[0]==="A" ? '<span class="b b-cool">la tiene Amazon</span>'
      : vf[0]==="T" ? '<span class="b b-bad">la tiene '+esc(vf[1]||"un tercero")+'</span>'
      : vf[0]==="S" ? '<span class="b b-bad">ficha suprimida, no hay botón</span>'
      : '<span class="b b-mute">sin oferta de compra</span>';
    h += fset("Terceros en la ficha ("+c3.length+")",
      '<div style="font-size:11.5px;color:var(--ink-2);margin-bottom:6px">Oferta destacada '+
        (window.VERIF?('comprobada en la ficha el '+window.VERIF.fecha+': '):'')+quienBB+'</div>'+
      '<div class="tw"><table><thead><tr><th>Vendedor</th><th class="r">Precio</th><th class="r">Gap</th></tr></thead><tbody>'+
      c3.map(function(x){
        var g=num(x[12]);
        return '<tr><td>'+esc(txt(x[7]||x[6]))+'<div style="font-size:10.5px;color:var(--ink-3)">'+esc(txt(x[8]))+'</div></td>'+
          '<td class="r num">'+eur(x[11])+'</td>'+

      }).join("")+'</tbody></table></div>');
  }

  var dv=dvBy[asin]||[], dh=dhBy[asin]||[];
  if(dh.length||dv.length){
    var mot={}; dh.forEach(function(x){ mot[x[6]]=(mot[x[6]]||0)+1; });
    var top = Object.keys(mot).sort(function(a,b){return mot[b]-mot[a];}).slice(0,4);
    h += fset("Devoluciones", kvs([
      ["En la ventana viva", '<b class="num">'+dv.length+'</b> <span style="color:var(--ink-3);font-size:11.5px">('+rango(DV,0)+')</span>'],
      ["En nueve meses", '<b class="num">'+dh.length+'</b>'],
      ["Motivos más frecuentes", top.map(function(m){ return esc(m)+' <span class="mono" style="color:var(--ink-3)">'+mot[m]+'</span>'; }).join("<br>")]
    ]));
  }

  var tr=(trBy[asin]||[])[0];
  if(tr) h += fset("Transparency", kvs([
    ["Bloque", esc(txt(tr[0]))],["Venta 60 días", tr[4]==null?null:eur(tr[4])],
    ["Canal", esc(txt(tr[6]))],["Decisión", esc(txt(tr[11]))],["Qué hacer", esc(txt(tr[12]))]
  ]));

  var as=(asBy[asin]||[])[0];
  var sup=apBy[asin]||[], comoSup=apSub[asin]||[];
  if(as||sup.length||comoSup.length){
    var b = "";
    if(as) b += kvs([["En la selección Q4", '<span class="b b-ok">sí</span>'],
      ["Estado de stock", /ROTURA|Sin stock|Solo Vendor/.test(String(as[10]))?'<span class="b b-bad">'+esc(txt(as[10]))+'</span>':esc(txt(as[10]))],
      ["Suplentes asignados", sup.length?String(new Set(sup.map(function(x){return x[8];})).size):"ninguno"]]);
    if(comoSup.length) b += '<div class="fnote">Actúa como suplente de '+
      comoSup.map(function(x){ return '<span class="asin" onclick="verFicha(\''+esc(x[0])+'\')">'+esc(x[0])+'</span>'; }).join(", ")+'.</div>';
    h += fset("Ads Q4", b||'<div class="fnote">—</div>');
  }

  var inc = (ivBy[asin]||[]).map(function(x){return ["Vendor",x];}).concat((isBy[asin]||[]).map(function(x){return ["Seller",x];}));
  if(inc.length) h += fset("Incidencias ("+inc.length+")",
    inc.map(function(p){ var x=p[1];
      return '<div class="fnote" style="border-bottom:1px solid var(--line-soft)"><b>'+esc(x[0])+'</b> · '+esc(p[0])+' · '+esc(txt(x[1]))+
        '<div style="color:var(--ink-3);margin-top:3px">'+esc(txt(x[4]))+'</div>'+
        '<div style="margin-top:4px"><span class="b b-warn">'+esc(txt(x[8]))+'</span></div></div>';
    }).join(""));

  prb.innerHTML = h;
  sheet.setAttribute("data-open","1");
  prb.parentElement.scrollTop = 0;
};

(function(){

    var v=q.value.trim().toLowerCase();

    var hits=[];
    for(var i=0;i<SO.length && hits.length<40;i++){
      var r=SO[i];
      if((String(r[2]||"")+" "+String(r[3]||"")+" "+String(r[4]||"")).toLowerCase().indexOf(v)>-1) hits.push(r);
    }
    if(!hits.length){ out.innerHTML='<div class="gs-none">Ninguna referencia coincide.</div>'; out.hidden=false; return; }
    out.innerHTML = hits.map(function(r){
      return '<button data-a="'+esc(r[2])+'"><span class="a">'+esc(r[2])+'</span> '+
        '<span class="sku">'+esc(txt(r[3]))+'</span><div class="t">'+esc(txt(r[4]))+'</div></button>';
    }).join("");
    out.hidden=false;
    out.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click",function(){ verFicha(b.dataset.a); out.hidden=true; q.value=""; });
    });
  }
  q.addEventListener("input",run);
  q.addEventListener("focus",run);
  document.addEventListener("click",function(e){ if(!e.target.closest(".gs")) out.hidden=true; });
})();

}

/* ======== EVOLUCIÓN DE VENTAS ======== */
/* Regla de esta pestaña: los dos canales no se mezclan ni se suman nunca, y cada
   uno se nombra por su magnitud real.
   · Seller (TUELEKTRO) es SELL-OUT: lo que compra el cliente final.
   · Vendor (CORBERÓ ES 1) es SELL-IN: lo que Amazon nos compra a nosotros. Que
     Amazon pida más puede ser reposición de almacén, no demanda.
   Antes esta pestaña enseñaba una sola cifra de «unidades vendidas» que mezclaba
   las dos cosas. Eso se ha retirado. */
function vVentas(){
  var w = document.createDocumentFragment();
  var V = window.VENTAS;
  if(!V){
    w.appendChild(el(card("Evolución de ventas","",
      '<div class="empty">Falta el bloque de datos de ventas.</div>','')));
    return w;
  }
  var comp = V.semanas.filter(function(s){ return s.completa; });
  var B = comp[comp.length-1], A = comp[comp.length-2];

  function pct(ahora, antes, inv){
    if(ahora==null || antes==null || !antes) return '';
    var p = Math.round(100*(ahora-antes)/antes);
    if(p===0) return ' <span style="color:var(--ink-3);font-size:11.5px">=</span>';
    var bueno = inv ? p<0 : p>0;
    return ' <span style="font-size:11.5px;color:'+(bueno?'var(--ok)':'var(--bad)')+'">'+(p>0?'+':'')+p+'%</span>';
  }

  /* --- aviso de cabecera: qué es cada cosa --- */
  w.appendChild(el(card("Los dos canales, y por qué no se suman", "lee esto antes que las cifras",
    '<div class="note" style="border-top:0;line-height:1.6">'+
    '<b>Seller · '+esc(V.canales.seller.nombre)+'</b> → <b>sell-out</b>: '+esc(V.canales.seller.explica)+'. Es demanda real.<br>'+
    '<b>Vendor · '+esc(V.canales.vendor.nombre)+'</b> → <b>sell-in</b>: '+esc(V.canales.vendor.explica)+'. Son órdenes de compra, '+
    'así que un pico puede ser reposición de almacén y no que se venda más.<br><br>'+
    'Son magnitudes distintas: <b>no se suman, no se promedian y no se comparan entre sí</b>. Se miran una al lado de la otra.'+
    '</div>','')));

  /* --- indicadores de la última semana completa --- */
  if(B){
    w.appendChild(el('<div class="kpis n3 sec">'+
      kpi("Seller · sell-out neto", eur(B.seller.sellOutNeto,0), "bruto "+eur(B.seller.sellOutBruto,0)+" menos el 30% de TUELEKTRO"+pct(B.seller.sellOutNeto, A&&A.seller.sellOutNeto), "is-ok") +
      kpi("Seller · unidades", fm(B.seller.uds), "ticket medio "+eur(B.seller.ticket)+pct(B.seller.uds, A&&A.seller.uds), "") +
      kpi("Seller · oferta destacada", fm(B.seller.buybox,1)+"%", "del tiempo la tenemos nosotros"+pct(B.seller.buybox, A&&A.seller.buybox), B.seller.buybox<50?"is-bad":"") +
      '</div>'));
    w.appendChild(el('<div class="kpis n3 sec">'+
      kpi("Vendor · factura la marca", eur(B.vendor.cogs,0), "lo que paga Amazon (COGS enviado)"+pct(B.vendor.cogs, A&&A.vendor.cogs), "is-cool") +
      kpi("Vendor · unidades pedidas", fm(B.vendor.udsPedidas), "órdenes de compra de Amazon"+pct(B.vendor.udsPedidas, A&&A.vendor.udsPedidas), "") +
      kpi("Vendor · enviado", eur(B.vendor.shipped,0), fm(B.vendor.udsEnviadas)+" unidades servidas"+pct(B.vendor.shipped, A&&A.vendor.shipped), "") +
      '</div>'));
  }

  /* --- la tabla madre: semana a semana, un bloque por canal --- */
  var fs2 = V.semanas.map(function(s){
    return '<tr><td><b>'+esc(s.sem)+'</b><div style="font-size:10.5px;color:var(--ink-3)">'+esc(s.desde)+' a '+esc(s.hasta)+'</div>'+
      (s.completa?'':'<span class="b b-warn">'+s.dias+' de 7 días</span>')+'</td>'+
      '<td class="r num" style="border-left:1px solid var(--line)"><b>'+eur(s.seller.sellOutNeto,0)+'</b></td>'+
      '<td class="r num" style="color:var(--ink-3)">'+eur(s.seller.sellOutBruto,0)+'</td>'+
      '<td class="r num">'+fm(s.seller.uds)+'</td>'+
      '<td class="r num">'+fm(s.seller.buybox,1)+'%</td>'+
      '<td class="r num" style="border-left:1px solid var(--line)"><b>'+eur(s.vendor.cogs,0)+'</b></td>'+
      '<td class="r num" style="color:var(--ink-3)">'+eur(s.vendor.sellIn,0)+'</td>'+
      '<td class="r num">'+fm(s.vendor.udsPedidas)+'</td></tr>';
  }).join("");
  w.appendChild(el(card("Ventas por canal, semana a semana", "fuente: MerchantSpring, un informe por canal",
    '<div class="tw"><table><thead>'+
    '<tr><th rowspan="2">Semana ISO</th>'+
    '<th colspan="4" style="text-align:center;border-left:1px solid var(--line)">Seller · '+esc(V.canales.seller.nombre)+' · <b>sell-out</b></th>'+
    '<th colspan="3" style="text-align:center;border-left:1px solid var(--line)">Vendor · 95KT9 · <b>sell-in</b></th></tr>'+
    '<tr><th class="r" style="border-left:1px solid var(--line)">Factura la marca</th><th class="r">Sell-out bruto</th><th class="r">Uds</th><th class="r">BuyBox</th>'+
    '<th class="r" style="border-left:1px solid var(--line)">Factura la marca</th><th class="r">Pedido a PVP</th><th class="r">Uds pedidas</th></tr>'+
    '</thead><tbody>'+fs2+'</tbody></table></div>',
    '<b>Las dos primeras columnas de cada canal son lo que factura la marca</b>, y por eso <b>sí</b> se pueden comparar entre sí.<br>'+
    '· En Seller, el sell-out menos el <b>30% de margen de TUELEKTRO</b>. El bruto queda al lado en gris.<br>'+
    '· En Vendor, el <b>COGS de lo enviado</b>, que es lo que Amazon nos paga. Al lado, en gris, el pedido valorado a PVP, que es bastante más alto y no es ingreso.<br><br>'+
    'Lo que sigue sin poder compararse son las <b>unidades</b>: en Seller son ventas al cliente y en Vendor son órdenes de compra de Amazon.<br><br>'+
    'La columna <b>BuyBox</b> es el porcentaje de tiempo que la oferta destacada ha sido nuestra en Seller. '+
    'Aquí está la respuesta a lo de la «BuyBox compartida»: <b>no es un sí o un no, es un reparto</b>, y ronda la mitad del tiempo. '+
    'Un anuncio de Sponsored Products sólo se sirve mientras tengamos la oferta destacada, así que ese porcentaje es un techo para la publicidad.')));

  /* --- ads por semana y canal --- */
  var fa = V.ads.semanas.map(function(s){
    var cs = {}; s.canales.forEach(function(c){ cs[c.canal]=c; });
    return '<tr><td><b>'+esc(s.sem)+'</b>'+(s.completa?'':' <span class="b b-warn">'+s.dias+' d</span>')+'</td>'+
      ['Seller','Vendor'].map(function(k){
        var c = cs[k];
        if(!c) return '<td class="r">—</td><td class="r">—</td><td class="r">—</td>';
        return '<td class="r num" style="border-left:1px solid var(--line)">'+eur(c.coste,0)+'</td>'+
               '<td class="r num">'+eur(c.ventas,0)+'</td>'+
               '<td class="r num"><b>'+(c.roas!=null?fm(c.roas,2):"—")+'</b></td>';
      }).join("")+'</tr>';
  }).join("");
  w.appendChild(el(card("Inversión publicitaria por canal y semana", V.ads.desde+" a "+V.ads.hasta+" · "+V.ads.fuente,
    '<div class="tw"><table><thead>'+
    '<tr><th rowspan="2">Semana ISO</th>'+
    '<th colspan="3" style="text-align:center;border-left:1px solid var(--line)">Cuenta TUELEKTRO (Seller)</th>'+
    '<th colspan="3" style="text-align:center;border-left:1px solid var(--line)">Cuenta CORBERO (Vendor)</th></tr>'+
    '<tr><th class="r" style="border-left:1px solid var(--line)">Inversión</th><th class="r">Ventas del anuncio</th><th class="r">ROAS</th>'+
    '<th class="r" style="border-left:1px solid var(--line)">Inversión</th><th class="r">Ventas del anuncio</th><th class="r">ROAS</th></tr>'+
    '</thead><tbody>'+fa+'</tbody></table></div>',
    'El ROAS se recalcula como ventas entre inversión del conjunto de la semana, <b>no promediando los ROAS de cada campaña</b>, que daría otro número y sería incorrecto. '+
    'Las ventas son las que Amazon atribuye al anuncio, no las totales del canal: compararlas con la tabla de arriba da el peso real de la publicidad.')));

  /* --- detalle por producto, una tabla por canal --- */
  function tablaDetalle(cfgId, titulo, lista, esVendor){
    if(!lista || !lista.length) return null;
    var suben = lista.filter(function(p){ return p.difUds>0; }).length;
    var bajan = lista.filter(function(p){ return p.difUds<0; }).length;
    var paran = lista.filter(function(p){ return p.antesUds>0 && p.ahoraUds===0; }).length;
    var arran = lista.filter(function(p){ return p.antesUds===0 && p.ahoraUds>0; }).length;
    var unidad = esVendor ? "uds pedidas" : "uds vendidas";
    return tabla({
      id:cfgId,
      title:titulo, sub:V.detalle.ventana,
      ph:"ASIN, modelo, familia o producto…",
      rows:lista, max:300, sort:6, dir:-1,
      search:function(r){ return ((r.asin||"")+" "+(r.modelo||"")+" "+(r.fam||"")+" "+(r.titulo||"")).toLowerCase(); },
      chips:[{t:"Prioritarias Q4",v:"prio",n:lista.filter(function(p){return p.prio;}).length},
             {t:"Dejan de vender",v:"paran",n:paran},
             {t:"Arrancan",v:"arran",n:arran},
             {t:"Suben",v:"suben",n:suben},
             {t:"Bajan",v:"bajan",n:bajan}],
      chipTest:function(r,v){
        if(v==="prio")  return !!r.prio;
        if(v==="paran") return r.antesUds>0 && r.ahoraUds===0;
        if(v==="arran") return r.antesUds===0 && r.ahoraUds>0;
        if(v==="suben") return r.difUds>0;
        if(v==="bajan") return r.difUds<0;
        return true;
      },
      cols:[
        {t:"ASIN",k:"asin",render:function(r){ return asinCell(r.asin); }},
        {t:"Modelo",k:"modelo",render:function(r){ return '<span class="sku">'+esc(txt(r.modelo))+'</span>'+
          (r.prio?' <span class="b b-warn" title="Prioritaria de la Tarifa Q4">Q4</span>':''); }},
        {t:"Producto",k:"titulo",render:function(r){ return '<div class="ti-1">'+esc(txt(r.titulo))+'</div>'; }},
        {t:"Familia",k:"fam",render:function(r){ return '<span style="color:var(--ink-3);font-size:11.5px">'+esc(txt(r.fam))+'</span>'; }},
        {t:"Uds antes",k:"antesUds",r:1,render:function(r){ return '<span class="num">'+fm(r.antesUds)+'</span>'; }},
        {t:"Uds ahora",k:"ahoraUds",r:1,render:function(r){ return '<span class="num">'+fm(r.ahoraUds)+'</span>'; }},
        {t:"Dif. "+unidad,k:"difUds",r:1,sortv:function(r){ return r.difUds; },render:function(r){
          if(!r.difUds) return '<span style="color:var(--ink-3)">=</span>';
          return '<b class="num" style="color:'+(r.difUds>0?'var(--ok)':'var(--bad)')+'">'+(r.difUds>0?'+':'')+fm(r.difUds)+'</b>'; }},
        {t:esVendor?"Pedido":"Vendido",k:"ahoraEur",r:1,render:function(r){ return '<span class="num">'+eur(r.ahoraEur,0)+'</span>'; }},
        {t:"Dif. €",k:"difEur",r:1,sortv:function(r){ return r.difEur; },render:function(r){
          if(!r.difEur) return '<span style="color:var(--ink-3)">=</span>';
          return '<span class="num" style="color:'+(r.difEur>0?'var(--ok)':'var(--bad)')+'">'+(r.difEur>0?'+':'')+eur(r.difEur,0)+'</span>'; }},
        {t:esVendor?"Stock Vendor":"Oferta",k:esVendor?"stock":"oferta",render:function(r){
          return esVendor ? (r.stock==null?'<span style="color:var(--ink-3)">—</span>':'<span class="num">'+fm(r.stock)+'</span>')
                          : ofertaB(r.oferta); }}
      ],
      note: esVendor
        ? 'Son <b>órdenes de compra de Amazon</b>, no ventas al cliente. Una caída aquí puede ser simplemente que Amazon tiene almacén lleno. Las unidades canceladas y rechazadas no se descuentan de esta cifra.'
        : 'Son <b>ventas al cliente final</b>. Antes de leer una caída como falta de demanda, mira la oferta y el stock de la misma fila, y el porcentaje de BuyBox de la semana.'
    });
  }
  var tS = tablaDetalle("detS","Seller · qué se ha movido, producto a producto", V.detalle.seller, false);
  if(tS) w.appendChild(tS);
  var tV = tablaDetalle("detV","Vendor · qué ha pedido Amazon, producto a producto", V.detalle.vendor, true);
  if(tV) w.appendChild(tV);

  /* --- campañas --- */
  var camp = V.ads.campanas;
  w.appendChild(tabla({
    id:"camp",
    title:"Campañas de Amazon Ads", sub:camp.length+" filas · una por campaña y semana",
    ph:"campaña, tipo, canal o semana…",
    rows:camp, max:500, sort:6, dir:-1,
    search:function(r){ return ((r.camp||"")+" "+(r.prod||"")+" "+(r.canal||"")+" "+(r.sem||"")).toLowerCase(); },
    chips:[{t:"Seller",v:"Seller",n:camp.filter(function(c){return c.canal==="Seller";}).length},
           {t:"Vendor",v:"Vendor",n:camp.filter(function(c){return c.canal==="Vendor";}).length},
           {t:"Gasta y no vende",v:"cero",n:camp.filter(function(c){return c.coste>0 && !c.ventas;}).length}],
    chipTest:function(r,v){ return v==="cero" ? (r.coste>0 && !r.ventas) : r.canal===v; },
    selects:[{key:"sem",label:"Semana",opts:V.ads.semanas.map(function(s){return s.sem;}),
              test:function(r,v){ return r.sem===v; }},
             {key:"tp",label:"Tipo",opts:["Sponsored Products","Sponsored Brands","Sponsored Display"],
              test:function(r,v){ return r.prod===v; }}],
    cols:[
      {t:"Semana",k:"sem"},
      {t:"Canal",k:"canal",render:function(r){ return '<span class="b '+(r.canal==="Vendor"?"b-cool":"b-ok")+'">'+esc(r.canal)+'</span>'; }},
      {t:"Tipo",k:"prod",render:function(r){ return '<span style="color:var(--ink-3);font-size:11.5px">'+esc(String(r.prod).replace("Sponsored ","")) +'</span>'; }},
      {t:"Campaña",k:"camp",render:function(r){ return '<div class="ti-1">'+esc(txt(r.camp))+'</div>'; }},
      {t:"Clics",k:"clics",r:1,render:function(r){ return '<span class="num">'+fm(r.clics)+'</span>'; }},
      {t:"Inversión",k:"coste",r:1,render:function(r){ return '<span class="num">'+eur(r.coste,2)+'</span>'; }},
      {t:"Ventas",k:"ventas",r:1,render:function(r){ return '<span class="num">'+eur(r.ventas,0)+'</span>'; }},
      {t:"ROAS",k:"roas",r:1,render:function(r){

        var c = r.roas>=5?'var(--ok)':(r.roas>=2?'var(--warn)':'var(--bad)');
        return '<b class="num" style="color:'+c+'">'+fm(r.roas,2)+'</b>'; }}
    ],
    note:'Una campaña con inversión y cero ventas no está mal por sí sola si acaba de arrancar. Con varias semanas seguidas así, sí.'
  }));

  /* --- prioritarias de Amazon que no están en el catálogo --- */
  var sa = V.prioritarias.amazonSinAsin || [];
  if(sa.length){
    w.appendChild(el(card("Prioritarias de Amazon que no están en el seguimiento", sa.length+" referencias",
      '<div class="tw"><table><thead><tr><th>Modelo</th><th>Producto</th><th>Canal en la tarifa</th></tr></thead><tbody>'+
      sa.map(function(p){ return '<tr><td class="sku">'+esc(p.modelo)+'</td><td>'+esc(p.producto)+
        '</td><td><span class="b b-warn">'+esc(p.canal)+'</span></td></tr>'; }).join("")+
      '</tbody></table></div>',
      'Están en la hoja «Tarifa Q4-26» con canal Amazon y su modelo no aparece en el catálogo de '+fm(SO.length)+' referencias. '+

      '(ASIN B0HM7ZNDLS, oferta Flex activa con 132 unidades): esa falta en el seguimiento.')));
  }


  /* ---- publicidad por referencia, los dos canales (MerchantSpring) ---- */
  if(window.MS && MS.ads && MS.ads.length){
    var sinVenta = MS.ads.filter(function(a){ return a.coste>0 && !a.ventas; });
    w.appendChild(tabla({
      id:"adsref",
      title:"Publicidad por referencia", sub:MS.ads.length+" referencias con inversión · "+MS.ventana.split(";")[0],
      ph:"ASIN, modelo, familia o producto…",
      rows:MS.ads, max:300, sort:5, dir:-1,
      search:function(r){ return ((r.asin||"")+" "+(r.sku||"")+" "+(r.familia||"")+" "+(r.titulo||"")).toLowerCase(); },
      chips:[{t:"Seller",v:"Seller",n:MS.ads.filter(function(a){return a.canal==="Seller";}).length},
             {t:"Vendor",v:"Vendor",n:MS.ads.filter(function(a){return a.canal==="Vendor";}).length},
             {t:"Gasta y no vende",v:"cero",n:sinVenta.length},
             {t:"ACOS por encima del 25%",v:"acos",n:MS.ads.filter(function(a){return a.acos>25;}).length}],
      chipTest:function(r,v){
        if(v==="cero") return r.coste>0 && !r.ventas;
        if(v==="acos") return r.acos>25;
        return r.canal===v; },
      cols:[
        {t:"ASIN",k:"asin",render:function(r){ return asinCell(r.asin); }},
        {t:"Canal",k:"canal",render:function(r){ return '<span class="b '+(r.canal==="Vendor"?"b-cool":"b-ok")+'">'+esc(r.canal)+'</span>'; }},
        {t:"Modelo",k:"sku",render:function(r){ return '<span class="sku">'+esc(txt(r.sku))+'</span>'; }},
        {t:"Producto",k:"titulo",render:function(r){ return '<div class="ti-1">'+esc(txt(r.titulo))+'</div>'; }},
        {t:"Clics",k:"clics",r:1,render:function(r){ return '<span class="num">'+fm(r.clics)+'</span>'; }},
        {t:"Inversión",k:"coste",r:1,render:function(r){ return '<span class="num">'+eur(r.coste,2)+'</span>'; }},
        {t:"Ventas del anuncio",k:"ventas",r:1,render:function(r){ return '<span class="num">'+eur(r.ventas,0)+'</span>'; }},
        {t:"ACOS",k:"acos",r:1,render:function(r){
          if(r.acos==null) return '<span style="color:var(--ink-3)">—</span>';
          var c = r.acos<=10?'var(--ok)':(r.acos<=25?'var(--warn)':'var(--bad)');
          return '<b class="num" style="color:'+c+'">'+fm(r.acos,1)+'%</b>'; }},
        {t:"ROAS",k:"roas",r:1,render:function(r){ return '<span class="num">'+(r.roas==null?"—":fm(r.roas,2))+'</span>'; }},
        {t:"CPC",k:"cpc",r:1,render:function(r){ return '<span class="num">'+(r.cpc==null?"—":eur(r.cpc))+'</span>'; }}
      ],
      note:'Esto es lo que la tabla de campañas no puede dar: <b>la publicidad atribuida a cada referencia</b>. '+
        'Las campañas de Sponsored Brands no se reparten por producto y quedan fuera, así que la suma de esta tabla es menor que la de campañas: no cuadran y no deben cuadrar.<br><br>'+
        '<b>'+sinVenta.length+' referencias gastan y no venden nada</b> en esta ventana. Una semana suelta no dice nada; varias seguidas sí.'
    }));

  /* ---- Vendor por referencia: BuyBox, visitas y conversión ---- */
  if(window.MS && MS.vendor && MS.vendor.length){
    var bajos = MS.vendor.filter(function(v){ return v.pedido>0 && v.buybox!=null && v.buybox<50; });
    w.appendChild(tabla({
      id:"venref",
      title:"Vendor · BuyBox, visitas y conversión por referencia", sub:MS.vendor.length+" referencias · "+MS.ventana.split(";")[0],
      ph:"ASIN, modelo, familia o categoría…",
      rows:MS.vendor, max:300, sort:6, dir:-1,
      search:function(r){ return ((r.asin||"")+" "+(r.modelo||"")+" "+(r.familia||"")+" "+(r.categoria||"")+" "+(r.titulo||"")).toLowerCase(); },
      chips:[{t:"BuyBox por debajo del 50%",v:"bb",n:bajos.length},
             {t:"Pierden visitas",v:"vis",n:MS.vendor.filter(function(v){return v.visitasPrev>0 && v.visitas<v.visitasPrev;}).length},
             {t:"Caen en pedido",v:"ped",n:MS.vendor.filter(function(v){return v.pedidoPrev>0 && v.pedido<v.pedidoPrev;}).length}],

        if(v==="vis") return r.visitasPrev>0 && r.visitas<r.visitasPrev;
        return r.pedidoPrev>0 && r.pedido<r.pedidoPrev; },
      cols:[
        {t:"ASIN",k:"asin",render:function(r){ return asinCell(r.asin); }},
        {t:"Modelo",k:"modelo",render:function(r){ return '<span class="sku">'+esc(txt(r.modelo))+'</span>'; }},
        {t:"Producto",k:"titulo",render:function(r){ return '<div class="ti-1">'+esc(txt(r.titulo))+'</div>'; }},

/* ======== HISTÓRICO SEMANAL ======== */
function delta(a,b,dec,sufijo){
  if(a==null||b==null) return '<span style="color:var(--ink-3)">—</span>';
  var d = a-b;
  if(Math.abs(d) < (dec?0.005:0.5)) return '<span style="color:var(--ink-3)">sin cambio</span>';
  var c = d>0 ? "var(--ok)" : "var(--bad)";
  return '<span class="num" style="color:'+c+';font-weight:600">'+(d>0?"+":"")+fm(d,dec)+(sufijo||"")+'</span>';
}
function vHistorico(){
  var w = document.createDocumentFragment();
  if(!SEM.orden.length){
    w.appendChild(el(card("Histórico semanal","",'<div class="empty">Todavía no hay ninguna semana archivada.</div>')));
    return w;
  }
  var s = SEM.map[semSel] || SEM.map[SEM.orden[SEM.orden.length-1]];
  var medida = s.med === "Medida";

  // selector de semanas
  var sel = el('<section class="card sec"><div class="card-h"><h2>Semana que se consulta</h2>'+
    '<span class="sub">'+SEM.orden.length+' archivadas · '+SEM.medidas.length+' con dato propio</span></div>'+
    '<div class="fb"><span class="chips"></span></div></section>');
  var cw = sel.querySelector(".chips");
  SEM.orden.slice().reverse().forEach(function(k){
    var x = SEM.map[k];
    var esta = (k === s.sem);
    var b = el('<button class="chip" aria-pressed="'+(esta?"true":"false")+'">'+esc(k)+
      '<span class="c">'+esc(x.corte)+'</span></button>');
    if(x.med!=="Medida") b.style.opacity = ".6";
    b.addEventListener("click",function(){ semSel = k; var t=activa; activa=null; ir(t,false); });
    cw.appendChild(b);
  });
  w.appendChild(sel);

  // semana medida anterior, para comparar
  var prev = null;
  for(var i=SEM.orden.indexOf(s.sem)-1; i>=0; i--){
    if(SEM.map[SEM.orden[i]].med==="Medida"){ prev = SEM.map[SEM.orden[i]]; break; }
  }

  if(!medida){
    w.appendChild(el('<section class="card sec" style="border-color:var(--bad)">'+
      '<div class="card-h"><h2 style="color:var(--bad)">Esta semana no tiene dato propio</h2></div>'+
      '<div class="note" style="border-top:0">La foto archivada el '+esc(s.corte)+' es idéntica a la de <b>'+
      esc(s.med.replace(/^.*que /,""))+'</b>: cuando se archivó, los informes de Seller y Vendor Central no se habían'+
      ' vuelto a descargar. Las cifras que ves abajo son las de esa semana anterior, no una medición nueva, y por eso'+
      ' esta semana queda fuera de la evolución.</div></section>'));
  }

  w.appendChild(el('<div class="kpis sec">'+
    kpi("Semana", esc(s.sem), "corte "+esc(s.corte), medida?"":"is-bad") +
    kpi("Stock Seller", fm(s.stock), prev?("frente a "+fm(prev.stock)+" en "+prev.sem):"", "") +
    kpi("Referencias con stock", fm(s.conStock), "de "+fm(s.filas.length)) +
    kpi("Unidades vendidas", s.uds?fm(s.uds):"—", s.uds?"en la semana":"pendiente de cargar", s.uds?"is-ok":"") +
    kpi("Facturación", s.fact?eur(s.fact,0):"—", s.fact?"en la semana":"pendiente de cargar", s.fact?"is-ok":"") +
    '</div>'));

  if(prev && medida){
    var ch = '<div class="tw"><table><thead><tr><th>Indicador</th><th class="r">'+esc(prev.sem)+'</th>'+
      '<th class="r">'+esc(s.sem)+'</th><th class="r">Diferencia</th></tr></thead><tbody>'+
      [["Stock Seller", prev.stock, s.stock, 0, ""],
       ["Stock Vendor", prev.vendor, s.vendor, 0, ""],
       ["Referencias con stock", prev.conStock, s.conStock, 0, ""],
       ["Unidades vendidas", prev.uds, s.uds, 0, ""],
       ["Facturación", prev.fact, s.fact, 0, " €"]].map(function(f){
        /* Un cero que es «todavía no cargado» no se resta: daría un −100 % inventado.
           Las ventas de la semana en curso no están hasta que cierra la semana ISO. */
        var falta = (f[2]==null || f[2]===0 || f[2]==="") && f[1];
        return '<tr><td>'+esc(f[0])+'</td><td class="r num">'+fm(f[1],f[3])+esc(f[4])+'</td>'+
          '<td class="r num">'+(falta?'<span style="color:var(--ink-3)">—</span>':fm(f[2],f[3])+esc(f[4]))+'</td>'+
          '<td class="r">'+(falta?'<span style="color:var(--ink-3);font-size:11.5px">pendiente de cargar</span>':delta(f[2],f[1],f[3],f[4]))+'</td></tr>';
      }).join("")+'</tbody></table></div>';
    w.appendChild(el(card("Contra la semana anterior medida", prev.sem+" → "+s.sem, ch)));
  }

  if(SEM.medidas.length>1){
    w.appendChild(el(card("Evolución","solo las semanas con dato propio",
      barras(SEM.medidas.map(function(k){ return [k+" · "+SEM.map[k].corte, SEM.map[k].stock]; })),
      'Las semanas marcadas como «sin dato nuevo» quedan fuera a propósito: no son mediciones.')));
  }

  w.appendChild(tabla({
    id:"hist",
    title:"Detalle de "+s.sem, sub:"corte "+s.corte+" · "+fm(s.filas.length)+" referencias",
    ph:"ASIN, modelo o producto…", rows:s.filas, max:1000,
    search:function(r){ return ((r[4]||"")+" "+(r[5]||"")+" "+(r[3]||"")).toLowerCase(); },
    selects:[{key:"of",label:"Oferta Seller",opts:["Activa FBM","Activa Flex","Inactiva","Sin oferta"],
      test:function(r,v){ return r[7]===v; }}],
    cols:[
      {t:"ASIN",k:4,render:function(r){ return asinCell(r[4]); }},
      {t:"Modelo",k:5,render:function(r){ return '<span class="sku">'+esc(txt(r[5]))+'</span>'; }},
      {t:"Categoría",k:2},
      {t:"Familia",k:3,render:function(r){ return '<span style="color:var(--ink-3);font-size:11.5px">'+esc(txt(r[3]))+'</span>'; }},
      {t:"Oferta",k:7,render:function(r){ return ofertaB(r[7]); }},
      {t:"Stock S.",k:9,r:1,render:function(r){ return stockC(r[9],r[7]); }},
      {t:"Stock V.",k:8,r:1,render:function(r){ return r[8]==null?'<span style="color:var(--ink-3)">—</span>':'<span class="num">'+fm(r[8])+'</span>'; }},
      {t:"PVP",k:10,r:1,render:function(r){ return '<span class="num">'+(r[10]==null?"—":eur(r[10]))+'</span>'; }},
      {t:"BuyBox",k:12,render:function(r){ return bbB(r[12]); }},
      {t:"Uds sem.",k:16,r:1,render:function(r){ return r[16]==null?'<span style="color:var(--ink-3)">—</span>':'<span class="num">'+fm(r[16])+'</span>'; }},
      {t:"Facturación",k:17,r:1,render:function(r){ return r[17]==null?'<span style="color:var(--ink-3)">—</span>':'<span class="num">'+eur(r[17],0)+'</span>'; }}
    ],
    note:'Cada semana se archiva entera y no se borra nunca. La columna <b>Medición</b> del Excel dice si la semana se midió o si la fuente no se había refrescado.'
  }));
  var _av=avisosDe("hist"); if(_av) w.appendChild(el(_av));
  return w;
}

/* ======== CALENDARIO ======== */
function vCalend(){
  var w=document.createDocumentFragment();
  var hoy=(function(){ var d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); })();
  var fut = CA.filter(function(r){ var d=pdate(r[0]); return d && d>=hoy; });
  var sig = fut.map(function(r){ return {d:pdate(r[0]),r:r}; }).sort(function(a,b){return a.d-b.d;})[0];
  var dias = sig?Math.round((sig.d-hoy)/86400000):null;
  w.appendChild(el('<div class="kpis sec">'+
    kpi("Hitos del trimestre", fm(CA.length), fut.length+" todavía por delante") +
    kpi("Siguiente hito", dias===0?"hoy":("en "+dias+" días"), sig?esc(sig.r[0])+" · "+esc(sig.r[1]).slice(0,48):"", "is-cool") +
    kpi("Cortes de stock", fm(CA.filter(function(r){return r[2]==="Stock";}).length), "el del 21/10 es el que queda") + '</div>'));

  var rows = CA.map(function(r){ var d=pdate(r[0]); return {r:r,d:d,pas:d&&d<hoy}; });
  var h='<div class="tw"><table><thead><tr><th>Fecha</th><th>Hito</th><th>Tipo</th><th>Canal</th><th>Status</th><th>Notas</th></tr></thead><tbody>'+
    rows.map(function(x){
      var r=x.r, dd = x.d?Math.round((x.d-hoy)/86400000):null;
      var fia = /^\[([^\]]+)\]/.exec(String(r[6]||""));
      var nota = String(r[6]||"").replace(/^\[[^\]]+\]\s*/,"");
      var fc = fia ? (/Oficial de Amazon$/.test(fia[1])?"ok":(/calendario/i.test(fia[1])?"cool":"warn")) : "mute";
      return '<tr style="'+(x.pas?"opacity:.52":"")+'">'+
        '<td style="white-space:nowrap"><span class="mono" style="font-weight:600;color:'+(x.pas?"var(--ink-3)":"var(--accent)")+'">'+esc(r[0])+'</span>'+
          (dd!=null&&dd>=0?'<div style="font-size:10.5px;color:var(--ink-3)">'+(dd===0?"hoy":"en "+dd+" d")+'</div>':'<div style="font-size:10.5px;color:var(--ink-3)">vencido</div>')+'</td>'+
        '<td style="min-width:200px"><b>'+esc(r[1])+'</b></td>'+
        '<td><span class="b b-mute">'+esc(txt(r[2]))+'</span></td>'+
        '<td><span class="b b-cool">'+esc(txt(r[3]))+'</span></td>'+
        '<td>'+(r[5]?'<span class="b b-warn">'+esc(r[5])+'</span>':'<span class="b b-mute">—</span>')+'</td>'+
        '<td style="max-width:420px;font-size:11.5px;color:var(--ink-2)">'+
          (fia?'<span class="b b-'+fc+'" style="margin-right:5px">'+esc(fia[1])+'</span>':'')+esc(nota)+'</td></tr>';
    }).join("")+'</tbody></table></div>';
  w.appendChild(el(card("Calendario Q4 2026","22 hitos",h,
    'Cada hito lleva marcada su <b>fiabilidad</b>. El 23/09 y el 18/11 no son eventos de venta: son los plazos para <i>enviar</i> ofertas. Y los cortes de stock del 09/09 y el 21/10 son de llegada a un centro de Amazon, algo que con Seller Flex no aplica literalmente porque el almacén es de la marca.')));
  return w;
}

/* ---------- montaje ---------- */
var tabsEl=document.getElementById("tabs"), view=document.getElementById("view");
var activa=null;
TABS.forEach(function(t){
  var b = el('<button class="tab" role="tab" aria-selected="false" id="tab-'+t.id+'">'+esc(t.t)+
    (t.n?'<span class="n">'+fm(t.n)+'</span>':'')+'</button>');
  b.addEventListener("click",function(){ ir(t.id,true); });
  tabsEl.appendChild(b);
});
function ir(id,push){
  var t = TABS.filter(function(x){return x.id===id;})[0] || TABS[0];
  if(activa===t.id) return;
  activa=t.id;
  TABS.forEach(function(x){ document.getElementById("tab-"+x.id).setAttribute("aria-selected", x.id===t.id?"true":"false"); });
  view.innerHTML="";
  // Si una pestaña falla, que se vea el fallo. Una página en blanco no dice nada
  // y el que la mira no sabe si es que no hay datos o es que se ha roto.
  try {
    view.appendChild(t.build());
  } catch(err) {
    view.appendChild(el('<section class="card sec"><div class="card-h"><h2>No se ha podido pintar esta pestaña</h2></div>'+
      '<div class="note">Los datos están, pero algo ha fallado al montarla. Avisa a Roicos con este detalle:<br>'+
      '<span class="mono" style="color:var(--bad)">'+esc(String(err && err.message || err))+'</span></div></section>'));
    if(window.console) console.error(err);
  }
  // el número de columnas de los KPI depende de cuántos haya en esa pestaña
  view.querySelectorAll(".kpis").forEach(function(k){ k.classList.add("n"+k.children.length); });
  // si venimos de pulsar un indicador, la tabla ya se encarga de traerse a la vista
  if(!window.__pend) window.scrollTo(0,0);
  if(push){ try{ history.replaceState(null,"","#"+t.id); }catch(e){} }
  try{ localStorage.setItem("corbero-tab",t.id); }catch(e){}
}
var inicial = (location.hash||"").replace("#","");
if(!TABS.some(function(x){return x.id===inicial;})){
  try{ inicial = localStorage.getItem("corbero-tab")||"resumen"; }catch(e){ inicial="resumen"; }
}
ir(TABS.some(function(x){return x.id===inicial;})?inicial:"resumen");
})();
</script>
